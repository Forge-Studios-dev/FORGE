# FORGE API alert rules (Prometheus). Adjust `for` and thresholds per environment.
groups:
  - name: forge-api
    rules:
      - alert: ForgeApiHighErrorRate
        expr: |
          sum(rate(forge_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(forge_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: FORGE API 5xx rate above 5%
          description: More than 5% of requests returned 5xx over the last 5 minutes.

      - alert: ForgeApiHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(forge_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: FORGE API p95 latency above 2s
          description: HTTP request duration p95 exceeded 2 seconds for 10 minutes.

      - alert: ForgeApiMetricsMissing
        expr: absent(forge_http_requests_total)
        for: 15m
        labels:
          severity: info
        annotations:
          summary: No forge_http_requests_total samples
          description: Metrics scrape may be down or METRICS_ENABLED is false on the API.
