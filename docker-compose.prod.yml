services:
  nginx:
    image: nginx:alpine
    container_name: forge-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
      - admin

  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  # Optional: set API/worker DATABASE_URL to postgres://${DB_USERNAME}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME}
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: forge-pgbouncer
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: forge-api
    restart: always
    environment:
      NODE_ENV: production
    env_file:
      - apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Honored only under Docker Swarm; ignored by `docker compose up` (plain Compose).
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    container_name: forge-worker
    restart: always
    environment:
      NODE_ENV: production
    env_file:
      - apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: forge-web
    restart: always
    env_file:
      - apps/web/.env.production

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: forge-admin
    restart: always
    env_file:
      - apps/admin/.env.production

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
