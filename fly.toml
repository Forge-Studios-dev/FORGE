# Fly.io — FORGE API (NestJS)
# Docs: docs/DEPLOY.md
# Create app once: fly apps create forge-studios-api --org personal

app = 'forge-studios-api'
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

# Runs on each deploy before new machines receive traffic (uses Fly DATABASE_URL secret).
[deploy]
  release_command = "node node_modules/typeorm/cli.js migration:run -d apps/api/dist/apps/api/src/database/data-source.js"

  # BOM often has no spare capacity for one-off release machines; use a smaller VM.
  [deploy.release_command_vm]
    size = "shared-cpu-1x"
    memory = "512mb"

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  BILLING_PROVIDER = 'stripe'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.http_options]
    idle_timeout = 600
    response_timeout = 600

  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/api/v1/health/live'
    timeout = '10s'

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 2
