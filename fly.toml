# Fly.io — FORGE API (NestJS)
# Docs: docs/DEPLOY.md
# Create app once: fly apps create forge-studios-api --org personal

app = 'forge-studios-api'
# 2026-08-21: bom is deprecated by Fly ("Region bom is deprecated and cannot
# have new resources provisioned") — not a capacity blip, a permanent removal.
# Machines and release_command VMs now run in sin. See docs/operations/FLY_SLO.md.
primary_region = 'sin'

[build]
  dockerfile = 'apps/api/Dockerfile'

# Runs on each deploy before new machines receive traffic (uses Fly DATABASE_URL secret).
[deploy]
  # rolling — bluegreen requires [[http_service.checks]]; health is manual/on-demand only.
  strategy = "rolling"
  release_command = "node node_modules/typeorm/cli.js migration:run -d apps/api/dist/apps/api/src/database/data-source.js"

  # Small VM for the one-off release_command machine.
  [deploy.release_command_vm]
    size = "shared-cpu-1x"
    memory = "512mb"

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  BILLING_PROVIDER = 'stripe'
  # Skill platform (ADR-006) — clients read GET /platform/config → skillFeatures.
  FEATURES_COURSES = 'true'
  FEATURES_MENTORSHIP = 'true'
  FEATURES_CHANNEL_POINTS = 'true'
  FEATURES_SKILL_ECONOMY_LMS = 'true'
  # H-B2: production VOD is Mux end-to-end (see fly.worker.toml + Dockerfile.worker).
  # Setting this on the API too keeps upload sessions/config-driven URLs consistent
  # even though the API doesn't run the ffmpeg consumer.
  VIDEO_TRANSCODE_PROVIDER = 'mux'

[http_service]
  internal_port = 3001
  force_https = true
  # MVP cost-first: one machine, auto-stop when idle (~20s cold start on wake).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.http_options]
    idle_timeout = 600
    response_timeout = 600

  # No [[http_service.checks]] — health endpoints are manual / deploy-diagnostic only.
  # GET /api/v1/health/live and /health/ready remain available on demand.

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
