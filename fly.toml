# Fly.io — FORGE API (NestJS)
# Docs: docs/MVP_GO_LIVE.md
# Create app once: fly apps create forge-studios-api --org personal

app = 'forge-studios-api'
primary_region = 'bom'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.http_options]
    idle_timeout = 600
    response_timeout = 600

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/api/v1/health'
    timeout = '5s'

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 2
