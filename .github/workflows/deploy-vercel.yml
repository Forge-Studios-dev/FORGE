# Deploy Next.js web + admin to Vercel (monorepo root upload — matches scripts/vercel-setup.sh).
# CLI: vercel@latest (API requires >=47.2.2). Secrets: docs/CI_CD.md
#
# Required GitHub secrets:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID          (team_… from apps/web/.vercel/project.json)
#   VERCEL_PROJECT_ID_WEB  (prj_…)
#   VERCEL_PROJECT_ID_ADMIN

name: Deploy Web & Admin (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'apps/web/vercel.project.json'
      - 'apps/admin/vercel.project.json'
      - '.github/workflows/deploy-vercel.yml'

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  FORGE_API_URL: https://api.forgestudios.net/api/v1
  FORGE_WEB_URL: https://forgestudios.net
  FORGE_ADMIN_URL: https://admin.forgestudios.net

jobs:
  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID_WEB; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name (see docs/CI_CD.md)"
              missing=1
            fi
          done
          exit "$missing"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_WEB: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Vercel token
        run: npx --yes vercel@latest whoami --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'

      - name: Deploy web (monorepo root)
        run: |
          npx --yes vercel@latest deploy . --prod --yes --token="$VERCEL_TOKEN" \
            --local-config=apps/web/vercel.project.json \
            -e "NEXT_PUBLIC_API_URL=${FORGE_API_URL}" \
            -e "API_INTERNAL_URL=${FORGE_API_URL}" \
            -e "NEXT_PUBLIC_APP_URL=${FORGE_WEB_URL}" \
            -e "NEXT_PUBLIC_WEB_URL=${FORGE_WEB_URL}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          VERCEL_TELEMETRY_DISABLED: '1'
          FORGE_API_URL: ${{ env.FORGE_API_URL }}
          FORGE_WEB_URL: ${{ env.FORGE_WEB_URL }}
          FORGE_ADMIN_URL: ${{ env.FORGE_ADMIN_URL }}

  deploy-admin:
    name: Deploy admin
    runs-on: ubuntu-latest
    needs: deploy-web
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID_ADMIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name (see docs/CI_CD.md)"
              missing=1
            fi
          done
          exit "$missing"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Vercel token
        run: npx --yes vercel@latest whoami --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: '1'

      - name: Deploy admin (monorepo root)
        run: |
          npx --yes vercel@latest deploy . --prod --yes --token="$VERCEL_TOKEN" \
            --local-config=apps/admin/vercel.project.json \
            -e "NEXT_PUBLIC_API_URL=${FORGE_API_URL}" \
            -e "NEXT_PUBLIC_WEB_URL=${FORGE_WEB_URL}" \
            -e "NEXT_PUBLIC_ADMIN_URL=${FORGE_ADMIN_URL}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          VERCEL_TELEMETRY_DISABLED: '1'
          FORGE_API_URL: ${{ env.FORGE_API_URL }}
          FORGE_WEB_URL: ${{ env.FORGE_WEB_URL }}
          FORGE_ADMIN_URL: ${{ env.FORGE_ADMIN_URL }}
