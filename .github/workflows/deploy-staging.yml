# Manual staging deploy — does NOT run on push to main.
# Requires GitHub environment "staging" with Fly/DB secrets.
# See docs/operations/STAGING.md

name: Deploy (staging)

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-api-staging:
    name: Deploy API staging (Fly.io)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Require Fly secret
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing FLY_API_TOKEN in staging environment"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # H-D1: pinned to superfly/flyctl-actions@1.5 SHA (mutable @master rejected).
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy to staging Fly app
        run: flyctl deploy --remote-only --ha=false --app forge-studios-api-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke staging health
        run: |
          URL="${STAGING_API_URL:-https://forge-studios-api-staging.fly.dev/api/v1/health/live}"
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 15 "$URL"; then
              echo "OK: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "Staging health check failed"
          exit 1
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}

      # RBAC / permission verification (CEOS-P16-T017). Opt-in: requires demo
      # users seeded in staging (bash scripts/reset-demo-users.sh). Never run
      # against production — demo credentials must not exist there.
      - name: Verify platform roles (RBAC)
        if: ${{ vars.STAGING_VERIFY_ROLES == 'true' }}
        run: |
          FORGE_SMOKE_API="${STAGING_API_BASE:-https://forge-studios-api-staging.fly.dev/api/v1}" \
            bash scripts/verify-platform-roles.sh
        env:
          STAGING_API_BASE: ${{ vars.STAGING_API_BASE }}

      - name: Verify channel sunset (when flag enabled)
        if: ${{ vars.STAGING_VERIFY_CHANNEL_SUNSET == 'true' }}
        run: |
          FORGE_SMOKE_API="${STAGING_API_BASE:-https://forge-studios-api-staging.fly.dev/api/v1}" \
            bash scripts/smoke-channel-sunset.sh
        env:
          STAGING_API_BASE: ${{ vars.STAGING_API_BASE }}
