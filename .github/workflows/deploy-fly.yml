# Deploy NestJS API to Fly.io (manual). Automatic deploys: Release (production) after CI on main.
# Required secret: FLY_API_TOKEN

name: Deploy API (Fly.io)

on:
  workflow_dispatch:

concurrency:
  group: fly-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Require Fly secret
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: FLY_API_TOKEN (see docs/CI_CD.md)"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # H-D1: pinned to superfly/flyctl-actions@1.5 SHA (mutable @master rejected).
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy to Fly.io
        # M-D7: pin the same region topology as the release workflow so an
        # emergency redeploy doesn't silently ship into a different region
        # than the routinely-tested production path. `fly.toml` currently uses
        # primary_region='sin' (bom was deprecated by Fly on 2026-08-21); keep
        # this flag explicit so it stays in lockstep with
        # .github/workflows/release.yml even if fly.toml is later edited.
        run: flyctl deploy --remote-only --primary-region sin --regions sin
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test production health
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://api.forgestudios.net/api/v1/health/live; then
              curl -sf https://api.forgestudios.net/api/v1/health/ready >/dev/null
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after deploy"
          exit 1

      - name: Rollback API on smoke failure
        if: failure()
        run: flyctl releases rollback -a forge-studios-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
