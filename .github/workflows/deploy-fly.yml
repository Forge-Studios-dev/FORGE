# Deploy NestJS API to Fly.io on push to main.
# Required secret: FLY_API_TOKEN
# Runtime secrets on Fly: DATABASE_URL, REDIS_URL, JWT_*, WEB_URL, ADMIN_URL (see docs/MVP_GO_LIVE.md)

name: Deploy API (Fly.io)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'fly.toml'
      - 'apps/api/Dockerfile'
      - '.github/workflows/deploy-fly.yml'

concurrency:
  group: fly-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test production health
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://api.forgestudios.net/api/v1/health; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after deploy"
          exit 1
