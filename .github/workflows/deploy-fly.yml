# Deploy NestJS API to Fly.io (manual). Automatic deploys: Release (production) after CI on main.
# Required secret: FLY_API_TOKEN

name: Deploy API (Fly.io)

on:
  workflow_dispatch:

concurrency:
  group: fly-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Require Fly secret
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: FLY_API_TOKEN (see docs/CI_CD.md)"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test production health
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://api.forgestudios.net/api/v1/health; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after deploy"
          exit 1

      - name: Rollback API on smoke failure
        if: failure()
        run: flyctl releases rollback -a forge-studios-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
