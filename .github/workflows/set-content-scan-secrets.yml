# One-shot: ADR-012 content-scan noop acknowledgment on Fly API + worker.
# Until a CSAM vendor webhook is live — NOT CSAM protection (ADR-009).
#
# Manual: gh workflow run set-content-scan-secrets.yml --ref main
name: Set content-scan secrets (Fly)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'none (ALLOW_NOOP) or webhook'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - webhook
      webhook_url:
        description: 'CONTENT_SCAN_WEBHOOK_URL (webhook mode only)'
        required: false
        type: string

jobs:
  set-secrets:
    name: Set content-scan secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require Fly secret
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret: FLY_API_TOKEN"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Apply content-scan secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CONTENT_SCAN_PROVIDER: ${{ inputs.mode }}
          CONTENT_SCAN_ALLOW_NOOP: ${{ inputs.mode == 'none' && 'true' || '' }}
          CONTENT_SCAN_WEBHOOK_URL: ${{ inputs.webhook_url }}
        run: |
          # Prefer flyctl (setup-flyctl PATH); scripts resolve flyctl|fly.
          bash scripts/set-content-scan-secrets-fly.sh
          # Worker sync needs SSH to API — for noop mode, set CONTENT_SCAN_* directly above is enough.
          if [[ "${CONTENT_SCAN_PROVIDER}" == "webhook" ]]; then
            bash scripts/sync-fly-worker-secrets.sh
          fi

      - name: Confirm secret names present (no values)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for app in forge-studios-api forge-studios-worker; do
            echo "==> $app"
            flyctl secrets list -a "$app" | awk 'NR==1 || /CONTENT_SCAN/'
          done
