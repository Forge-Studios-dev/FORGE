# Deploy auth/Firebase Fly secrets from GitHub Actions secrets.
# Add in repo Settings → Secrets → Actions, then: gh workflow run deploy-auth-secrets.yml
name: Deploy auth secrets (Fly)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly auth secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_CALLBACK_URL: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }}
          WEB_OAUTH_SUCCESS_URL: ${{ secrets.WEB_OAUTH_SUCCESS_URL }}
          WEB_URL: ${{ secrets.WEB_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FCM_ENABLED: ${{ secrets.FCM_ENABLED }}
        run: |
          set -euo pipefail
          APP="${FLY_APP:-forge-studios-api}"
          for s in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SMTP_PASS FIREBASE_PRIVATE_KEY FIREBASE_CLIENT_EMAIL FIREBASE_PROJECT_ID; do
            if [[ -z "${!s:-}" ]]; then
              echo "MISSING GitHub secret: $s"
              exit 1
            fi
          done
          fly secrets set \
            GOOGLE_OAUTH_ENABLED=true \
            GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
            GOOGLE_OAUTH_CALLBACK_URL="${GOOGLE_OAUTH_CALLBACK_URL:-https://api.forgestudios.net/api/v1/auth/google/callback}" \
            WEB_OAUTH_SUCCESS_URL="${WEB_OAUTH_SUCCESS_URL:-https://forgestudios.net/auth/oauth/callback}" \
            WEB_URL="${WEB_URL:-https://forgestudios.net}" \
            SMTP_HOST="${SMTP_HOST:-smtp.resend.com}" \
            SMTP_PORT="${SMTP_PORT:-587}" \
            SMTP_USER="${SMTP_USER:-resend}" \
            SMTP_PASS="${SMTP_PASS}" \
            MAIL_FROM="${MAIL_FROM:-noreply@forgestudios.net}" \
            FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            FIREBASE_CLIENT_EMAIL="${FIREBASE_CLIENT_EMAIL}" \
            FIREBASE_PRIVATE_KEY="${FIREBASE_PRIVATE_KEY}" \
            FCM_ENABLED="${FCM_ENABLED:-true}" \
            APP_CHECK_ENABLED=false \
            --app "$APP"
