# On-demand production smoke only — no scheduled / continuous health probes.
# Trigger manually via workflow_dispatch when you want a diagnostic run.
name: Synthetic Monitoring

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke mode (live = /health/live only; public = live + feed/search/config)'
        required: true
        default: 'public'
        type: choice
        options:
          - live
          - public

concurrency:
  group: synthetic-monitoring
  cancel-in-progress: true

jobs:
  smoke:
    name: Production smoke (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run smoke (${{ inputs.mode }})
        run: FORGE_SMOKE_MODE=${{ inputs.mode }} npm run smoke:api:prod
