# Quality gate for all apps — runs on PRs and pushes to main.
# Deploy workflows (Fly / Vercel) should pass this before shipping.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            mobile:
              - 'apps/mobile/**'
            packages:
              - 'packages/**'

  security-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=critical
      # HIGH-05: high-severity findings (multer, nodemailer, ws, next, etc.)
      # were previously invisible — critical-only gate showed 0 findings while
      # dozens of high-severity ones accumulated. Non-blocking for now since
      # several fixes are major-version bumps (@nestjs/platform-express,
      # nodemailer, next@16) that need their own tested upgrade PRs, not a
      # blind dependency bump here. Tracks the count so it can't go unnoticed.
      - name: High-severity audit report (non-blocking)
        if: always()
        run: |
          npm audit --audit-level=high --json > audit-high.json || true
          HIGH_COUNT=$(node -e "const r=require('./audit-high.json'); console.log((r.metadata?.vulnerabilities?.high||0)+(r.metadata?.vulnerabilities?.critical||0))")
          echo "## High/critical severity dependency findings: $HIGH_COUNT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "Non-blocking — see \`npm audit --audit-level=high\` locally for details. Known accepted-risk majors: multer (needs @nestjs/platform-express v11), nodemailer v9, next v16." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-packages:
    name: Build shared packages
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.admin == 'true' ||
      needs.changes.outputs.packages == 'true' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@forge/shared-types
      - run: npm run test --workspace=@forge/shared-types
      - run: npm run build --workspace=@forge/design-system

  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest
    needs: [changes, build-packages]
    if: >-
      needs.changes.outputs.api == 'true' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@forge/shared-types
      - run: npm run test --workspace=@forge/shared-types
      - run: npm run lint:ci --workspace=@forge/api
      - run: npm run build --workspace=@forge/api
      - run: npm run test --workspace=@forge/api
        env:
          NODE_ENV: test
      - run: npm run test:e2e --workspace=@forge/api
        env:
          NODE_ENV: test
      - name: API coverage report (F-1201)
        run: npm run test:cov --workspace=@forge/api
        env:
          NODE_ENV: test
      - name: Upload API coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: ignore

  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    needs: [changes, build-packages]
    if: >-
      needs.changes.outputs.web == 'true' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@forge/shared-types
      - run: npm run test --workspace=@forge/shared-types
      - run: npm run build --workspace=@forge/design-system
      - run: npm run lint --workspace=@forge/web
      - run: npm run test --workspace=@forge/web
      - run: npm run build --workspace=@forge/web
        env:
          NEXT_PUBLIC_API_URL: https://api.forgestudios.net/api/v1
          API_INTERNAL_URL: https://api.forgestudios.net/api/v1
          NEXT_PUBLIC_APP_URL: https://forgestudios.net
          NEXT_PUBLIC_WEB_URL: https://forgestudios.net

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: E2E smoke (web)
        run: npm run test:e2e --workspace=@forge/web -- e2e/smoke.spec.ts e2e/auth-nav.spec.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: E2E auth (web, when secrets set)
        run: |
          if [ -n "$E2E_TEST_EMAIL" ] && [ -n "$E2E_TEST_PASSWORD" ]; then
            npm run test:e2e --workspace=@forge/web -- e2e/auth.spec.ts
          else
            echo "Skipping auth e2e — E2E_TEST_EMAIL / E2E_TEST_PASSWORD not configured"
          fi
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

  mobile:
    name: Mobile — Flutter analyze & test
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.mobile == 'true' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze --no-fatal-infos

      - run: flutter test
        working-directory: apps/mobile

  admin:
    name: Admin — lint & build
    runs-on: ubuntu-latest
    needs: [changes, build-packages]
    if: >-
      needs.changes.outputs.admin == 'true' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@forge/shared-types
      - run: npm run test --workspace=@forge/shared-types
      - run: npm run build --workspace=@forge/design-system
      - run: npm run lint --workspace=@forge/admin
      - run: npm run test --workspace=@forge/admin
      - run: npm run build --workspace=@forge/admin
        env:
          NEXT_PUBLIC_API_URL: https://api.forgestudios.net/api/v1
          NEXT_PUBLIC_WEB_URL: https://forgestudios.net
          NEXT_PUBLIC_ADMIN_URL: https://admin.forgestudios.net
          SKIP_ENV_VALIDATION: 'true'

      - name: Install Playwright Chromium (admin)
        run: npx playwright install --with-deps chromium
        working-directory: apps/admin

      - name: E2E smoke (admin)
        run: npm run test:e2e --workspace=@forge/admin -- e2e/smoke.spec.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3002
          SKIP_ENV_VALIDATION: 'true'

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    # security-audit added (MED-05) — was previously independent of this gate,
    # so a PR could merge while it failed. CodeQL runs as a separate workflow
    # file and can't be added to `needs:` here; require it via GitHub branch
    # protection (Settings -> Branches -> required status checks) instead.
    needs: [api, web, admin, mobile, security-audit]
    if: always()
    steps:
      - name: Require jobs
        run: |
          test "${{ needs.api.result }}" = "success" || test "${{ needs.api.result }}" = "skipped"
          test "${{ needs.web.result }}" = "success" || test "${{ needs.web.result }}" = "skipped"
          test "${{ needs.admin.result }}" = "success" || test "${{ needs.admin.result }}" = "skipped"
          test "${{ needs.mobile.result }}" = "success" || test "${{ needs.mobile.result }}" = "skipped"
          test "${{ needs.security-audit.result }}" = "success" || test "${{ needs.security-audit.result }}" = "skipped"
          if [ "${{ needs.api.result }}" = "failure" ] || [ "${{ needs.web.result }}" = "failure" ] || [ "${{ needs.admin.result }}" = "failure" ] || [ "${{ needs.mobile.result }}" = "failure" ] || [ "${{ needs.security-audit.result }}" = "failure" ]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
