# Fly.io — FORGE video/analytics worker (BullMQ consumers, no public HTTP)
# Deploy: fly deploy -c fly.worker.toml
# Set secrets same as API + WORKER_ONLY=true

app = 'forge-studios-worker'
# bom is deprecated by Fly (2026-08-21) — see fly.toml for detail.
primary_region = 'sin'

[build]
  dockerfile = 'apps/api/Dockerfile.worker'

[env]
  NODE_ENV = 'production'
  WORKER_ONLY = 'true'
  PORT = '3001'
  BILLING_PROVIDER = 'stripe'
  VIDEO_TRANSCODE_PROVIDER = 'mux'

[[restart]]
  policy = 'always'
  max_retries = 10

# No [checks] — worker GET /health on PORT (main.ts) is manual / deploy-diagnostic only.

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
