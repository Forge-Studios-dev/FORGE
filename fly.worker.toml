# Fly.io — FORGE video/analytics worker (BullMQ consumers, no public HTTP)
# Deploy: fly deploy -c fly.worker.toml
# Set secrets same as API + WORKER_ONLY=true

app = 'forge-studios-worker'
# bom is deprecated by Fly (2026-08-21) — see fly.toml for detail.
primary_region = 'sin'

[build]
  dockerfile = 'apps/api/Dockerfile.worker'

[env]
  NODE_ENV = 'production'
  WORKER_ONLY = 'true'
  PORT = '3001'
  BILLING_PROVIDER = 'stripe'
  VIDEO_TRANSCODE_PROVIDER = 'mux'

[[restart]]
  policy = 'always'
  max_retries = 10

# MED-08: internal-only functional liveness check (not a public service —
# no [http_service]/[[services]] block, so this isn't exposed via Fly's edge
# proxy). Polls the bare health listener added in main.ts's bootstrapWorker,
# which only comes up after the Nest application context has fully booted.
[checks]
  [checks.worker_health]
    port = 3001
    type = 'http'
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 2
