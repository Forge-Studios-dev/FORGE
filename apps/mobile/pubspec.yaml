name: forge_mobile
description: FORGE – Live Creator Platform mobile app
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Routing
  go_router: ^17.3.0

  # HTTP
  dio: ^5.4.3

  # Secure storage
  flutter_secure_storage: ^10.3.1

  # Connectivity (drives the offline screen — see core/connectivity)
  connectivity_plus: ^7.3.0

  # Offline-first local cache for feed/watch-history/video-detail (HIGH-07)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Video player
  video_player: ^2.8.3
  chewie: ^1.7.4

  # Image
  cached_network_image: ^3.3.1

  google_fonts: ^8.2.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  crypto: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.3.3
  file_picker: ^11.0.3

  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.5+2
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  socket_io_client: ^3.0.2
  livekit_client: ^2.3.6

  # Crash reporting (CRIT-02) — enabled via --dart-define=SENTRY_DSN=...
  sentry_flutter: ^9.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  # Test-only fake platform for FlutterSecureStorage (HIGH-09) — already a
  # transitive dep via flutter_secure_storage; declared explicitly since
  # test code imports it directly.
  flutter_secure_storage_platform_interface: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
