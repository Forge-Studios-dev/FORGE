name: forge_mobile
description: FORGE – Live Creator Platform mobile app
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.1

  # HTTP
  dio: ^5.4.3

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Video player
  video_player: ^2.8.3
  chewie: ^1.7.4

  # Image
  cached_network_image: ^3.3.1

  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.3.3
  file_picker: ^8.0.0+1

  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+4
  url_launcher: ^6.3.0
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
